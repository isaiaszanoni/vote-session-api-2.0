plugins {
	id 'java'
    id 'jacoco'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.siccase'
version = '0.0.1-SNAPSHOT'
description = 'API para gerenciamento de sessões de votação em assembléias do Sicteste'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.amqp:spring-rabbit-stream'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15")
    compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("com.h2database:h2:2.2.224")
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()

    finalizedBy jacocoTestReport
    finalizedBy jacocoTestCoverageVerification
//    systemProperty("junit.jupiter.execution.parallel.enabled", "true")
//    systemProperty("junit.jupiter.execution.parallel.mode.default", "concurrent")
}

jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    dependsOn test

    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect { fileTree(dir: it, exclude: [
                'com/siccase/vote_session_api/dto/**',
                'com/siccase/vote_session_api/exception/**',
                'com/siccase/vote_session_api/mapper/**',
                'com/siccase/vote_session_api/model/**',
                'com/siccase/vote_session_api/enums/**',
                'com/siccase/vote_session_api/controller/GlobalExceptionHandler.class',
                'com/siccase/vote_session_api/utils/**',
                'com/siccase/vote_session_api/validation/**',
                'com/siccase/vote_session_api/VoteSessionApiApplication.class',
            ]) })
        )
    }

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        setFailOnViolation(false)

        rule {
            enabled = true
            element = 'CLASS'
            includes = ['com.siccase.vote_session_api.*']
            excludes = [
                    'com.siccase.vote_session_api.dto.*',
                    'com.siccase.vote_session_api.exception.*',
                    'com.siccase.vote_session_api.mapper.*',
                    'com.siccase.vote_session_api.model.*',
                    'com.siccase.vote_session_api.enums.*',
                    'com.siccase.vote_session_api.controller.GlobalExceptionHandler',
                    'com.siccase.vote_session_api.utils.*',
                    'com.siccase.vote_session_api.validation.*',
                    'com.siccase.vote_session_api.VoteSessionApiApplication'
            ]

            limit {
                counter = 'CLASS'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }
    }
}
